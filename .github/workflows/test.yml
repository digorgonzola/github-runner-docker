name: Docker Compose Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - renovate/**

jobs:
  docker-compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/') || github.event_name == 'push' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1

      - name: Setup Access Token
        run: |
          printf "%s\n" ${{ secrets.RUNNER_ACCESS_TOKEN }} > access_token.txt

      - name: Setup .env file
        run: |
          cat <<EOF > .env
          LABELS=ci,test
          ORGANISATION=${{ github.repository_owner }}
          REPLICAS=1
          RUNNER_GROUP=test
          EOF

      - name: Bake Docker images
        uses: docker/bake-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          files: docker-compose.yml
          load: true
          pull: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Start containers
        run: docker compose up -d --build

      - name: Wait for healthy
        run: |
          timeout 120 bash -c '
            while true; do
              unhealthy=$(docker compose ps --format json | jq -rs "[.[] | select(.Health != \"healthy\" and .Health != \"\")] | length")
              if [ "$unhealthy" -eq 0 ] && docker compose ps | grep -q "(healthy)"; then
                echo "All services healthy"
                break
              fi
              echo "Waiting for services..."
              docker compose ps
              sleep 5
            done
          '

      - name: Check for failures
        run: |
          if docker compose ps | grep -E "(Exit|exited)"; then
            echo "Some containers failed to start"
            docker compose logs
            exit 1
          fi

      - name: Check running containers
        run: docker compose ps

      - name: View logs (for debugging)
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
